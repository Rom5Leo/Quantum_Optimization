[tool.poetry]
name = "qcoptlib"
version = "0.1.0"
description = "Reusable quantum-optimization library: QUBO construction and QAOA solvers (Qiskit + Classiq), with Grover / QML to follow."
authors = ["Rom5Leo"]
readme = "README.md"
packages = [{ include = "qcoptlib", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
scipy = "^1.12"
matplotlib = "^3.8"
qiskit = "^2.0"
qiskit-aer = ">=0.17"  # 0.17+ is the first Aer release compatible with Qiskit 2.x
# classiq is optional: only needed to RUN the Classiq backend, not to import the library.
# add it when you want that backend:  poetry add classiq

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
jupyter = "^1.0"
ruff = "^0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:qiskit.*:"
]

